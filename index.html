<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#020617">
<title>Stock Scorecard</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="description" content="12-filter equity scorecard with Google Drive sync.">
<script src="https://accounts.google.com/gsi/client" async defer></script>
<style>
  :root{--bg:#020617;--card:#0f172a;--card2:#1e293b;--line:#334155;--txt:#f1f5f9;--mut:#94a3b8;--dim:#64748b;--cyan:#22d3ee;--em:#34d399;--am:#fbbf24;--rd:#f87171;}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{margin:0;background:var(--bg);color:var(--txt);font-family:ui-sans-serif,system-ui,-apple-system,sans-serif;font-size:15px;line-height:1.5}
  .wrap{max-width:640px;margin:0 auto;padding:20px 16px 60px}
  h1{font-size:22px;font-weight:600;letter-spacing:-.02em;margin:0}
  .mono{font-family:ui-monospace,"SF Mono",Menlo,monospace}
  .sub{color:var(--dim);font-size:13px;margin-top:6px}
  button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
  .btn{background:var(--cyan);color:#052e33;font-weight:600;font-size:14px;padding:10px 16px;border-radius:8px}
  .btn:active{opacity:.85}
  .btn-o{border:1px solid var(--line);color:var(--mut);padding:9px 14px;border-radius:8px;font-size:14px}
  .row{display:flex;align-items:center;gap:10px}
  .between{display:flex;align-items:center;justify-content:space-between;gap:12px}
  .wrapf{display:flex;flex-wrap:wrap;gap:8px}
  .summary{display:flex;gap:8px;margin:16px 0}
  .stat{flex:1;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 8px;text-align:center}
  .stat .n{font-size:22px;font-weight:700}
  .stat .l{font-size:11px;color:var(--mut);margin-top:2px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:10px}
  .name{font-weight:600}
  .tkr{font-size:12px;color:var(--dim)}
  .tag{font-size:10px;font-family:ui-monospace,monospace;padding:2px 6px;border-radius:5px}
  .tag-bank{background:rgba(34,211,238,.15);color:var(--cyan)}
  .tag-am{background:rgba(251,191,36,.15);color:var(--am)}
  .tag-em{background:rgba(52,211,153,.15);color:var(--em)}
  .tag-rd{background:rgba(248,113,113,.15);color:var(--rd)}
  .meter{display:flex;gap:3px;margin-top:10px}
  .pip{height:8px;width:100%;border-radius:2px;background:var(--card2)}
  .pip.p{background:var(--em)}.pip.f{background:#334155}.pip.u{background:rgba(251,191,36,.35)}
  .score{font-family:ui-monospace,monospace;font-size:26px;font-weight:700;line-height:1}
  .score span{font-size:15px;color:var(--dim)}
  .verd{font-size:12px;font-weight:600;margin-top:2px}
  .em{color:var(--em)}.am{color:var(--am)}.rd{color:var(--rd)}
  .action{margin-top:10px;padding:8px 10px;border-radius:7px;font-size:13px}
  .a-em{background:rgba(52,211,153,.1);color:var(--em)}
  .a-am{background:rgba(251,191,36,.1);color:var(--am)}
  .a-rd{background:rgba(248,113,113,.1);color:var(--rd)}
  .meta{display:flex;align-items:center;gap:10px;margin-top:10px;font-size:12px;color:var(--dim)}
  .trend{font-family:ui-monospace,monospace}
  .lnk{font-size:12px}.lnk.c{color:var(--cyan)}.lnk.r{color:var(--rd)}
  input[type=number],input[type=text]{background:var(--card2);border:1px solid var(--line);border-radius:6px;color:var(--txt);padding:8px 10px;font-size:14px;width:100%;font-family:inherit}
  input.num{text-align:right;font-family:ui-monospace,monospace}
  input:focus{outline:none;border-color:var(--cyan)}
  .cat{font-size:11px;font-family:ui-monospace,monospace;text-transform:uppercase;letter-spacing:.08em;color:var(--dim);margin:16px 0 8px}
  .fr{display:flex;align-items:center;gap:10px;margin-bottom:8px}
  .dot{height:9px;width:9px;border-radius:50%;flex:none}
  .dot.p{background:var(--em)}.dot.f{background:var(--rd)}.dot.u{background:#475569}
  .flabel{flex:1;font-size:14px;min-width:0}
  .flabel .th{color:var(--dim);font-family:ui-monospace,monospace;font-size:12px;margin-left:4px}
  .flabel .vf{color:rgba(251,191,36,.7);font-size:11px;margin-left:4px}
  .fbtn{font-family:ui-monospace,monospace;font-size:13px;border:1px solid var(--line);color:var(--cyan);border-radius:5px;padding:3px 7px}
  .fbtn.on{background:var(--cyan);color:#052e33;border-color:var(--cyan)}
  .vinput{display:flex;align-items:center;gap:5px;width:120px;flex:none}
  .vinput .u{font-size:12px;color:var(--dim);width:14px}
  .tri{display:flex;width:120px;flex:none;border:1px solid var(--line);border-radius:6px;overflow:hidden;font-size:12px}
  .tri button{flex:1;padding:6px 0;background:var(--card2);color:var(--mut)}
  .tri button.y{background:var(--em);color:#052e1a}.tri button.n{background:var(--rd);color:#3b0a0a}.tri button.q{background:#475569;color:#fff}
  .calc{margin:6px 0 10px 19px;background:rgba(2,6,23,.6);border:1px solid var(--line);border-radius:8px;padding:10px}
  .calc .note{font-size:11px;color:var(--dim);margin:0 0 8px}
  .calc .cf{flex:1;min-width:120px}
  .calc label{font-size:10px;color:var(--dim);display:block;margin-bottom:3px}
  .calc .small{width:64px;flex:none}
  .ann{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--mut);margin-top:8px}
  .valbox{border:1px solid rgba(52,211,153,.3);background:rgba(52,211,153,.05);border-radius:8px;padding:10px;margin:14px 0}
  .valbtn{font-size:12px;padding:5px 9px;border-radius:6px;border:1px solid var(--line);color:var(--txt)}
  .valbtn.on{background:var(--em);color:#052e1a;border-color:var(--em)}
  .live{border:1px solid var(--line);border-radius:8px;padding:12px;margin:14px 0;display:flex;justify-content:space-between;align-items:center}
  .empty{border:1px dashed var(--line);border-radius:10px;padding:30px;text-align:center;color:var(--dim);font-size:14px}
  .foot{margin-top:24px;font-size:11px;color:#475569;line-height:1.6}
  .cbx{accent-color:var(--cyan)}
  .src{font-size:11px;color:var(--cyan);opacity:.75;margin:-2px 0 10px 19px;line-height:1.4}
  a{color:var(--cyan)}

  /* ===== tabs ===== */
  .tabbar{display:flex;gap:4px;margin:16px 0 2px;border-bottom:1px solid var(--line)}
  .tabbtn{background:none;border:none;color:var(--dim);font-size:14px;font-weight:600;font-family:inherit;padding:9px 6px;cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px}
  .tabbtn.on{color:var(--txt);border-bottom-color:var(--cyan)}

  /* ===== compact stock table (dashboard) ===== */
  .theadrow{display:flex;align-items:center;gap:8px;padding:10px 4px 7px;font-size:10px;text-transform:uppercase;letter-spacing:.05em;color:var(--dim);border-bottom:1px solid var(--line)}
  .trow{display:flex;align-items:center;gap:8px;padding:11px 4px;border-bottom:1px solid var(--line);cursor:pointer}
  .trow:active{background:var(--card2)}
  .trow .tn{flex:1;min-width:0}
  .trow .tname{font-weight:600;font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .trow .tsec{font-size:11px;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:1px}
  .tcol-score{width:38px;text-align:right;flex:none}
  .tcol-tag{width:46px;text-align:center;flex:none}
  .tcol-rev{width:42px;text-align:right;flex:none}
  .trow .tscore{font-family:ui-monospace,monospace;font-weight:700;font-size:13.5px}
  .ttag{display:inline-block;font-size:9.5px;font-weight:700;padding:3px 5px;border-radius:5px;white-space:nowrap}
  .ttag.em{background:rgba(52,211,153,.15);color:var(--em)}
  .ttag.am{background:rgba(251,191,36,.15);color:var(--am)}
  .ttag.rd{background:rgba(248,113,113,.15);color:var(--rd)}
  .trev{font-size:10px;color:var(--dim)}
  .trev.rd{color:var(--rd);font-weight:600}

  /* ===== compare view ===== */
  .cksel{display:flex;align-items:center;gap:10px;padding:9px 4px;border-bottom:1px solid var(--line);cursor:pointer}
  .cksel input{width:17px;height:17px;flex:none}
  .cksel .cn{flex:1;min-width:0;font-size:13.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .cksel .cscore{font-family:ui-monospace,monospace;font-size:12px;color:var(--dim);flex:none}
  .cmpwrap{overflow-x:auto;margin-top:14px;border:1px solid var(--line);border-radius:10px;-webkit-overflow-scrolling:touch}
  .cmptable{border-collapse:collapse}
  .cmptable td,.cmptable th{padding:8px 12px;font-size:12.5px;border-bottom:1px solid var(--line);white-space:nowrap;text-align:center}
  .cmptable th{background:var(--card2);font-size:11px;color:var(--mut);font-weight:600;position:sticky;top:0}
  .cmptable td.lbl,.cmptable th.lbl{position:sticky;left:0;background:var(--card);text-align:left;font-weight:600;z-index:1;max-width:150px;overflow:hidden;text-overflow:ellipsis}
  .cmptable th.lbl{background:var(--card2);z-index:2}
  .cmptable tr.cat td{background:var(--bg);color:var(--cyan);font-size:10px;text-transform:uppercase;letter-spacing:.06em;font-weight:700;text-align:left;position:sticky;left:0}
  .cmpv{font-family:ui-monospace,monospace;font-size:11.5px}

  /* ===== sync decision modal ===== */
  .modal-backdrop{position:fixed;inset:0;background:rgba(2,6,23,.8);display:flex;align-items:center;justify-content:center;padding:20px;z-index:50}
  .modal{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:20px;max-width:400px;width:100%}
  .modal h3{margin:0 0 10px;font-size:17px}
  .modal .sub{margin:0 0 16px;font-size:13.5px;color:var(--mut);line-height:1.5}
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<script>
/* ===== framework ===== */
var CATS=["Profitability","Growth","Financial health","Ownership"];
var FILTERS=[
 {id:"roe",cat:"Profitability",label:"ROE",bankLabel:"ROE",unit:"%",op:"gt",t:15,bankT:15,src:"Screener → top ratios box (ROE %)"},
 {id:"roce",cat:"Profitability",label:"ROCE",bankLabel:"ROA",unit:"%",op:"gt",t:15,bankT:1,bankUnit:"%",src:"Screener → top ratios box (ROCE %)",bankSrc:"P&L Net profit ÷ Balance-sheet Total assets, or the bank's investor presentation (ROA)"},
 {id:"margin",cat:"Profitability",label:"5Y EBITDA margin",bankLabel:"Net interest margin",unit:"%",op:"gt",t:15,bankT:3,src:"Screener → P&L → OPM % row; average the last 5 years",bankSrc:"The bank's quarterly investor presentation (NIM), or (Interest income − Finance cost) ÷ assets"},
 {id:"salesG",cat:"Growth",label:"Sales growth · 5Y",unit:"%",op:"gt",t:10,src:"Screener → 'Compounded Sales Growth' box (5-yr)"},
 {id:"profitG",cat:"Growth",label:"Profit growth · 3-5Y",unit:"%",op:"gt",t:10,src:"Screener → 'Compounded Profit Growth' box (5-yr)"},
 {id:"epsG",cat:"Growth",label:"EPS growth · 5Y",unit:"%",op:"gt",t:10,src:"Screener → P&L → 'EPS in Rs' row, two years apart (or use ƒ)"},
 {id:"de",cat:"Financial health",label:"Debt to equity",bankLabel:"Capital adequacy ratio",unit:"",op:"lt",t:1,bankT:12,bankOp:"gt",bankUnit:"%",src:"Screener → top ratios box (Debt to equity)",bankSrc:"Screener ratios or the results Annexure (Capital Adequacy Ratio)"},
 {id:"icr",cat:"Financial health",label:"Interest coverage",unit:"x",op:"gt",t:3,bankSkip:true,src:"Screener → ratios, or P&L: EBIT ÷ Interest"},
 {id:"ocf",cat:"Financial health",label:"Positive OCF, 5 yrs",type:"bool",bankSkip:true,src:"Screener → Cash Flow tab → 'Cash from Operating Activity' (all 5 yrs positive?)"},
 {id:"dii",cat:"Ownership",label:"DII 6-mo change +",type:"bool",verify:true,src:"Screener → Shareholding → Quarterly: DIIs, latest vs 6 months ago"},
 {id:"fii",cat:"Ownership",label:"FII 6-mo change +",type:"bool",verify:true,src:"Screener → Shareholding → Quarterly: FIIs, latest vs 6 months ago"},
 {id:"pledge",cat:"Ownership",label:"Promoter pledge",unit:"%",op:"lt",t:10,src:"Screener → Shareholding → expand Promoters / 'Pledged %' (no line = 0%)"}
];
function cagr(n){return{note:"CAGR = (latest ÷ oldest)^(1÷years) − 1. Both figures from Screener's P&L. True CAGR is mathematically undefined when going from a loss to a profit (or profit to loss) — no real percentage describes that. A turnaround like that shows as 999% (very strong) or −999% (very weak) instead, the same convention Screener itself uses for undefined ratios — not a literal precise number, just an unambiguous signal either way.",
 fields:[{k:"start",label:n+", 5 yrs ago"},{k:"end",label:n+", latest"},{k:"yrs",label:"Yrs",def:"5",small:true}],
 compute:function(r){
  var s=+r.start,e=+r.end,y=+r.yrs||5;
  if(r.start===""||r.start==null||r.end===""||r.end==null||!y)return null;
  if(s>0&&e>0)return(Math.pow(e/s,1/y)-1)*100;
  if(s<=0&&e>0)return 999;  // loss -> profit: unambiguously strong, CAGR itself undefined
  if(s>0&&e<=0)return-999;  // profit -> loss: unambiguously weak, CAGR itself undefined
  return null;               // loss -> loss: too ambiguous to sentinel automatically, judge it yourself
 }};}
var CALCS={
 roce:{bankOnly:true,ann:true,note:"ROA = Net profit ÷ Total assets. Net profit = P&L \"Net Profit\" row · Total assets = Balance Sheet \"Total Assets\" row (bottom row, always visible). Tick 'quarterly' to annualise ×4.",
  fields:[{k:"np",label:"Net profit (₹)"},{k:"ta",label:"Total assets (₹)"}],
  compute:function(r,a){return r.np&&r.ta?(+r.np*(a?4:1))/+r.ta*100:null;}},
 margin:{bankOnly:true,ann:true,note:"NIM = (Interest income − Finance cost) ÷ assets. Interest income = \"Revenue\" row · Finance cost = \"Interest\" row, right below it (Quarterly Results / P&L tab). Assets = \"Total Assets\" row (Balance Sheet tab) — Screener's \"Loans n Advances\" sub-line under Other Assets is unreliable for banks (uses a generic template, doesn't capture the real loan book), so don't use that instead. Note: Screener's own \"Financing Margin %\" isn't this — that's ÷ interest income, not ÷ assets, so don't type that number in here. Tick 'quarterly' to annualise ×4.",
  fields:[{k:"ii",label:"Interest income (₹)"},{k:"fc",label:"Finance cost (₹)"},{k:"ea",label:"Total assets (₹)"}],
  compute:function(r,a){return r.ii&&r.fc&&r.ea?(+r.ii-+r.fc)*(a?4:1)/+r.ea*100:null;}},
 salesG:cagr("Sales"),profitG:cagr("Net profit"),epsG:cagr("EPS (₹)")
};
/* supplementary quality signals — NOT counted in the /12, shown as an overlay */
var QUALITY=[
 {id:"cashconv",label:"Cash conversion (OCF ÷ Net profit)",type:"num",unit:"x",good:0.8,warn:0.5,bankSkip:true,note:"How much profit turns into real cash (3-5yr avg). ≥0.8 healthy; low = earnings-quality risk / possible accounting flags.",src:"Screener → Cash Flow ('Cash from Operating Activity') ÷ P&L (Net profit)"},
 {id:"fcf",label:"Free cash flow positive",type:"tri",bankSkip:true,note:"OCF minus capex. Positive = self-funding growth; negative = capex-hungry or burning cash.",src:"Screener → Cash Flow tab → 'Free Cash Flow' row"},
 {id:"promTrend",label:"Promoter holding trend",type:"pick",opts:["Rising","Stable","Falling"],good:"Rising",warn:"Stable",note:"Promoters buying is a strong insider signal; a falling stake is a red flag the score misses. Some companies (e.g. HDFC Bank, post its 2023 merger) genuinely have no promoter — shows as 0%, not missing data. Pick Stable in that case, not a red flag.",src:"Screener → Shareholding → Promoters row, across quarters"},
 {id:"marginTrend",label:"Operating margin trend",bankLabel:"Net interest margin trend",type:"pick",opts:["Expanding","Stable","Contracting"],good:"Expanding",warn:"Stable",note:"Direction of profitability — expanding beats a high-but-shrinking margin.",src:"Screener → P&L → OPM % row: rising or falling?",bankSrc:"Quarterly results / investor presentation — is NIM rising or falling over recent quarters?"},
 {id:"roic",label:"ROIC vs cost of capital",type:"num",unit:"%",good:15,warn:12,bankSkip:true,note:"Return on invested capital — the purest value-creation test. Must beat cost of capital (~12% in India); below that, growth destroys value. ≥15% = true compounder.",src:"Tickertape Scorecard (ROIC), or Screener ROCE as a proxy"},
 {id:"peg",label:"PEG · P/E ÷ profit growth",type:"num",low:true,unit:"",good:1,warn:1.5,note:"Valuation relative to growth. <1 = cheap for its growth; >1.5 = paying up. Cross-checks the Valuation Comfort call.",src:"Tickertape (PEG ratio), or Screener: current P/E ÷ profit-growth %"}
];
function evalQ(q,val,bank){
 if(bank&&q.bankSkip)return"na";
 if(val===""||val==null)return"unknown";
 if(q.type==="num"){var n=+val;if(isNaN(n))return"unknown";if(q.low)return n<=q.good?"good":n<=q.warn?"warn":"concern";return n>=q.good?"good":n>=q.warn?"warn":"concern";}
 if(q.type==="tri")return val===true?"good":val===false?"concern":"unknown";
 return val===q.good?"good":val===q.warn?"warn":"concern";
}
function qConcerns(s){return QUALITY.filter(function(q){return evalQ(q,s.metrics[q.id],s.isBank)==="concern";}).length;}
function evalF(f,val,bank){
 if(bank&&f.bankSkip)return"pass";
 if(f.type==="bool"){return val===true?"pass":val===false?"fail":"unknown";}
 if(val===""||val==null||isNaN(+val))return"unknown";
 var n=+val,op=bank&&f.bankOp?f.bankOp:f.op,t=bank&&f.bankT!==undefined?f.bankT:f.t;
 return(op==="gt"?n>t:n<t)?"pass":"fail";
}
function score(s){var r=FILTERS.map(function(f){return evalF(f,s.metrics[f.id],s.isBank);});
 return{r:r,p:r.filter(function(x){return x==="pass";}).length,u:r.filter(function(x){return x==="unknown";}).length};}
function verd(p){return p>=10?{l:"Strong",c:"em"}:p>=7?{l:"Watch",c:"am"}:{l:"Exit",c:"rd"};}
var VALS=["Undervalued","Fairly Valued","Overvalued"];
/* Maps the old 5-tier wording (still sitting in the seed data / anything already saved)
   onto Tickertape's actual 3-tier labels, so nothing already picked gets silently lost. */
function normalizeVal(v){
 if(v==="Very Cheap"||v==="Cheap")return"Undervalued";
 if(v==="Fair")return"Fairly Valued";
 if(v==="Expensive"||v==="Very Expensive")return"Overvalued";
 return v;
}
function action(p,v){v=normalizeVal(v);if(p<7)return"Exit in a planned way, over 2-3 sessions";
 if(p<10)return"Watch for 1 quarter — exit if it doesn't improve";
 if(!v)return"Strong — now run the valuation check";
 if(v==="Undervalued")return"Add more, systematically";
 if(v==="Fairly Valued")return"Hold, accumulate on dips";
 return"Hold — do not add. Wait for price to return to fair";}
/* Explicit "can I buy this now" tag — same p/v thresholds as action(), just condensed
   to a short label + color so it reads at a glance across the whole dashboard. */
function buyTag(p,v){
 v=normalizeVal(v);
 if(p<7)return{l:"Not a buy",c:"rd"};
 if(p<10)return{l:"Not yet",c:"am"};
 if(!v)return{l:"Check valuation",c:"am"};
 if(v==="Undervalued")return{l:"Buy",c:"em"};
 if(v==="Fairly Valued")return{l:"Buy on dips",c:"am"};
 return{l:"Wait — too pricey",c:"rd"};
}

/* ===== seeded holdings (starting estimates — verify on first review) ===== */
function SEED(){
 function m(o){return o;}
 return [
 {id:"h1",name:"TCS",ticker:"TCS",sector:"IT",isBank:false,valuation:"Cheap",lastUpdated:null,history:[],metrics:m({roe:51,roce:60,margin:26,salesG:10.2,profitG:8,epsG:8,de:0.05,icr:200,ocf:true,dii:null,fii:null,pledge:0})},
 {id:"h2",name:"Infosys",ticker:"INFY",sector:"IT",isBank:false,valuation:"",lastUpdated:null,history:[],metrics:m({roe:34,roce:40,margin:24,salesG:8,profitG:8,epsG:8,de:0.05,icr:200,ocf:true,dii:null,fii:null,pledge:0})},
 {id:"h3",name:"Wipro",ticker:"WIPRO",sector:"IT",isBank:false,valuation:"",lastUpdated:null,history:[],metrics:m({roe:15,roce:17,margin:17,salesG:2,profitG:3,epsG:3,de:0.1,icr:50,ocf:true,dii:null,fii:null,pledge:0})},
 {id:"h4",name:"ITC",ticker:"ITC",sector:"FMCG",isBank:false,valuation:"",lastUpdated:null,history:[],metrics:m({roe:35,roce:35,margin:35,salesG:9.9,profitG:8,epsG:8,de:0.02,icr:200,ocf:true,dii:null,fii:null,pledge:0})},
 {id:"h5",name:"ITC Hotels",ticker:"ITCHOTELS",sector:"Hotels",isBank:false,valuation:"Expensive",lastUpdated:null,history:[],metrics:m({roe:7,roce:9,margin:34,salesG:8,profitG:8,epsG:5,de:0.01,icr:50,ocf:false,dii:false,fii:false,pledge:0})},

/* ===== state ===== */
var KEY="stockScorecard:v1";
var stocks=load(),draft=null,openCalc={};
var view="dash",compareSel=[],syncPrompt=null;
var driveState=Object.assign({token:null},loadDriveMeta());
function load(){try{var r=localStorage.getItem(KEY);if(r)return JSON.parse(r);}catch(e){}return SEED();}
function persist(){try{localStorage.setItem(KEY,JSON.stringify(stocks));}catch(e){}}
function daysSince(t){return t?Math.floor((Date.now()-t)/86400000):null;}
function sectorAlloc(){
 var byW={},byC={},tot=0,anyW=false,n=stocks.length||1;
 stocks.forEach(function(s){var sec=(s.sector||"Unclassified");byC[sec]=(byC[sec]||0)+1;var w=+s.weight;if(w>0){anyW=true;byW[sec]=(byW[sec]||0)+w;tot+=w;}});
 var rows=[],k;
 if(anyW){for(k in byW)rows.push({sec:k,pct:byW[k]/tot*100,mode:"w"});}
 else{for(k in byC)rows.push({sec:k,pct:byC[k]/n*100,cnt:byC[k],mode:"c"});}
 rows.sort(function(a,b){return b.pct-a.pct;});
 var over=rows.filter(function(r){return r.mode==="w"?r.pct>30:(r.cnt>=4||r.pct>=35);});
 return {rows:rows,over:over,anyW:anyW};
}
function esc(s){return(s||"").replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;"}[c];});}

/* ===== render ===== */
function render(){draft?renderEditor():(view==="compare"?renderCompare():renderDash());if(syncPrompt)document.getElementById("app").insertAdjacentHTML("beforeend",syncPromptHTML());}
function setView(v){view=v;render();}
function tabbarHTML(){
 return '<div class="tabbar">'
  +'<button class="tabbtn '+(view==="dash"?"on":"")+'" onclick="setView(\'dash\')">Dashboard</button>'
  +'<button class="tabbtn '+(view==="compare"?"on":"")+'" onclick="setView(\'compare\')">Compare</button>'
  +'</div>';
}
function meterHTML(r){return '<div class="meter">'+r.map(function(x){return '<span class="pip '+(x==="pass"?"p":x==="fail"?"f":"u")+'"></span>';}).join("")+'</div>';}

function renderDash(){
 var sc=stocks.map(function(s){return{s:s,x:score(s)};}).sort(function(a,b){return b.x.p-a.x.p;});
 var strong=sc.filter(function(o){return o.x.p>=10;}).length;
 var watch=sc.filter(function(o){return o.x.p>=7&&o.x.p<10;}).length;
 var exit=sc.filter(function(o){return o.x.p<7;}).length;
 var due=stocks.filter(function(s){var d=daysSince(s.lastUpdated);return d===null||d>90;}).length;
 var h='';
 h+='<div class="between"><div><h1>Scorecard</h1><div class="sub">'+stocks.length+' holdings · '+due+' to review</div></div>'
   +'<button class="btn" onclick="addStock()">+ Add</button></div>';
 h+=tabbarHTML();
 h+='<div class="summary">'
   +'<div class="stat"><div class="n em">'+strong+'</div><div class="l">Strong</div></div>'
   +'<div class="stat"><div class="n am">'+watch+'</div><div class="l">Watch</div></div>'
   +'<div class="stat"><div class="n rd">'+exit+'</div><div class="l">Exit</div></div></div>';
 var sa=sectorAlloc();
 if(sa.over.length){
  h+='<div class="action a-rd" style="margin:0 0 12px">⚠ Sector over-allocation: '
   +sa.over.map(function(r){return esc(r.sec)+' '+(r.mode==="w"?Math.round(r.pct)+'%':r.cnt+' stocks');}).join(', ')
   +'. One theme going wrong drags the whole book — consider trimming or diversifying.</div>';
 }
 if(sa.rows.length&&!sa.anyW){
  h+='<div style="font-size:11px;color:var(--dim);margin:-4px 0 12px">Allocation shown by stock count. Add a Value to each holding for true value-based allocation.</div>';
 }
 if(!stocks.length){
  h+='<div class="empty">No stocks. Tap +Add to start.</div>';
 }else{
  h+='<div class="theadrow"><span style="flex:1">Stock</span><span class="tcol-score">Score</span><span class="tcol-tag">Call</span><span class="tcol-rev">Reviewed</span></div>';
  sc.forEach(function(o){h+=trowHTML(o.s,o.x);});
 }
 h+='<div class="foot">Starting values are estimates from our analysis — verify each on Screener/Tickertape on first review, then update after each quarter\'s results. DII/FII 6-mo change and valuation are left for you to fill. Not investment advice. Tap any row for the full breakdown.</div>';
 h+='<div class="live" style="margin-top:14px"><div><div style="font-size:13px;font-weight:600">Google Drive</div><div class="sub" id="driveStatus" style="margin-top:2px">'+driveStatusText()+'</div></div>'
   +'<button class="btn-o" onclick="'+(driveState.token?"syncNow()":"connectDrive()")+'">'+(driveState.token?"Sync now":"Connect &amp; sync")+'</button></div>';
 h+='<div class="row" style="margin-top:10px">'
   +'<button class="btn-o" onclick="exportData()">Export backup</button>'
   +'<button class="btn-o" onclick="document.getElementById(\'importFile\').click()">Import backup</button>'
   +'<input type="file" id="importFile" accept="application/json" style="display:none" onchange="importData(this)"></div>';
 h+='<div class="row" style="margin-top:8px"><button class="btn-o" onclick="restoreLocalBackup()">Restore last local backup</button></div>';
 h+='<div style="font-size:11px;color:var(--dim);margin-top:6px">Once connected, every "Save &amp; timestamp" also pushes to Drive automatically — no separate Sync tap needed for day-to-day updates. A local backup snapshot is still taken before every sync too, just in case; restoring it never touches Drive.</div>';
 document.getElementById("app").innerHTML=h;
}

/* One compact row per stock: name/sector, score, short buy call, review status.
   Tap anywhere on the row to open the full filter breakdown (same as before). */
function trowHTML(s,x){
 var v=verd(x.p),bt=buyTag(x.p,s.valuation);
 var d=daysSince(s.lastUpdated);
 var rev=d===null?"New":d>90?"Due":d+"d";
 var revCls=(d===null||d>90)?"rd":"";
 var flags=qConcerns(s);
 return '<div class="trow" onclick="editStock(\''+s.id+'\')">'
  +'<div class="tn"><div class="tname">'+esc(s.name||s.ticker)+(flags>0?' <span style="color:var(--rd)">⚠</span>':'')+'</div>'
  +'<div class="tsec">'+esc(s.sector||"")+(s.isBank?" · Bank":"")+'</div></div>'
  +'<span class="tcol-score"><span class="tscore '+v.c+'">'+x.p+'</span></span>'
  +'<span class="tcol-tag"><span class="ttag '+bt.c+'">'+buyTagShort(bt.l)+'</span></span>'
  +'<span class="tcol-rev"><span class="trev '+revCls+'">'+rev+'</span></span>'
  +'</div>';
}
function buyTagShort(l){
 if(l==="Buy")return"BUY";
 if(l==="Buy on dips")return"DIPS";
 if(l==="Not yet")return"WAIT";
 if(l==="Not a buy")return"EXIT";
 if(l==="Check valuation")return"CHK";
 return"HOLD"; // "Wait — too pricey"
}

function compareTableHTML(sel){
 var h='<div class="cmpwrap"><table class="cmptable"><thead><tr><th class="lbl"></th>';

 h+='</tr></thead><tbody>';

 h+='<tr><td class="lbl">Score</td>'+sel.map(function(s){var x=score(s),v=verd(x.p);return'<td><span class="cmpv '+v.c+'" style="font-weight:700">'+x.p+'/12</span></td>';}).join('')+'</tr>';
 h+='<tr><td class="lbl">Verdict</td>'+sel.map(function(s){var v=verd(score(s).p);return'<td><span class="'+v.c+'" style="font-weight:600">'+v.l+'</span></td>';}).join('')+'</tr>';
 h+='<tr><td class="lbl">Buy call</td>'+sel.map(function(s){var x=score(s),bt=buyTag(x.p,s.valuation);return'<td><span class="ttag '+bt.c+'">'+buyTagShort(bt.l)+'</span></td>';}).join('')+'</tr>';

 var lastCat=null;

 });

 });

 h+='</tbody></table></div>';

function filterRowLabel(f,sel){
 var anyBank=sel.some(function(s){return s.isBank;}),anyNon=sel.some(function(s){return!s.isBank;});
 if(!f.bankLabel)return esc(f.label);
 if(anyBank&&anyNon)return esc(f.label)+' / '+esc(f.bankLabel);
 return anyBank?esc(f.bankLabel):esc(f.label);
}
function qualityRowLabel(q,sel){
 var anyBank=sel.some(function(s){return s.isBank&&!q.bankSkip;}),anyNon=sel.some(function(s){return!s.isBank;});
 if(!q.bankLabel)return esc(q.label);
 if(anyBank&&anyNon)return esc(q.label)+' / '+esc(q.bankLabel);
 return anyBank?esc(q.bankLabel):esc(q.label);
}
function cmpFilterCellHTML(f,s){
 var val=s.metrics[f.id],res=evalF(f,val,s.isBank);
 var cls=res==="pass"?"em":res==="fail"?"rd":"dim",txt;
 if(res==="pass"&&f.bankSkip&&s.isBank)txt="N/A";
 else if(f.type==="bool")txt=val===true?"Yes":val===false?"No":"?";
 else if(val==null||val==="")txt="–";
 else txt=val+((s.isBank&&f.bankUnit!=null)?f.bankUnit:(f.unit||""));
 return'<td><span class="cmpv '+cls+'">'+esc(String(txt))+'</span></td>';
}
function cmpQualityCellHTML(q,s){
 var st=evalQ(q,s.metrics[q.id],s.isBank);
 if(st==="na")return'<td><span class="dim">N/A</span></td>';
 var cls=st==="good"?"em":st==="concern"?"rd":st==="warn"?"am":"dim";
 var lbl=st==="good"?"OK":st==="concern"?"Flag":st==="warn"?"Warn":"–";
 return'<td><span class="cmpv '+cls+'">'+lbl+'</span></td>';
}

 var h='<div class="calc"><p class="note">'+calc.note+'</p><div class="wrapf">';
 calc.fields.forEach(function(fld){
  h+='<div class="cf'+(fld.small?" small":"")+'"><label>'+fld.label+'</label>'
   +'<input class="num" type="number" step="any" value="'+(raw[fld.k]!=null?raw[fld.k]:(fld.def||""))+'" oninput="setRaw(\''+id+'\',\''+fld.k+'\',this.value)"></div>';
 });
 h+='</div>';
 if(calc.ann)h+='<label class="ann"><input type="checkbox" class="cbx" '+(raw.ann?"checked":"")+' onchange="setRaw(\''+id+'\',\'ann\',this.checked)"> Figures are quarterly (annualise ×4)</label>';
 h+='</div>';return h;
}

/* ===== editor events (targeted updates, no focus loss) ===== */
function setF(k,val){draft[k]=val;}
function setQ(id,val){draft.metrics[id]=val;renderEditor();}
function setQNum(id,val){
 draft.metrics[id]=val;
 var q=QUALITY.filter(function(x){return x.id===id;})[0];
 var skip=draft.isBank&&q.bankSkip,st=evalQ(q,val,draft.isBank);
 var dc=st==="good"?"p":st==="concern"?"f":"u";
 var d=document.getElementById("qdot_"+id);
 if(d){d.className="dot "+(skip?"u":dc);d.style.background=(!skip&&st==="warn")?"var(--am)":"";}
}
function setM(id,val){draft.metrics[id]=val;refreshLive();}
function setBool(id,val){draft.metrics[id]=val;document.getElementById("tri_"+id).outerHTML=triHTML(id,val);refreshLive();}
function setBank(c){draft.isBank=c;renderEditor();}
function setVal(v){draft.valuation=v;renderEditor();}
function toggleCalc(id){openCalc[id]=!openCalc[id];renderEditor();}
function setRaw(id,k,val){
 var raw=draft.metrics[id+"__raw"]||{};raw[k]=val;draft.metrics[id+"__raw"]=raw;
 var calc=CALCS[id],res=calc.compute(raw,raw.ann);
 if(res!=null&&!isNaN(res)){var rv=String(Math.round(res*100)/100);draft.metrics[id]=rv;var inp=document.getElementById("m_"+id);if(inp)inp.value=rv;}
 refreshLive();
}
function valboxHTML(s){
 var x=score(s);
 if(x.p<10)return"";
 var norm=normalizeVal(s.valuation);
 var h='<div class="valbox"><div class="cat" style="color:var(--em);margin:0 0 6px">Valuation check</div>'
  +'<div class="sub" style="margin:0 0 8px">Match whatever Tickertape shows for this stock\'s valuation:</div><div class="wrapf">';
 VALS.forEach(function(o){h+='<button class="valbtn '+(norm===o?"on":"")+'" onclick="setVal(\''+o+'\')">'+o+'</button>';});
 h+='</div></div>';
 return h;
}
function refreshLive(){
 var x=score(draft),v=verd(x.p),bt=buyTag(x.p,draft.valuation);
 FILTERS.forEach(function(f){var d=document.getElementById("dot_"+f.id);if(d){var res=evalF(f,draft.metrics[f.id],draft.isBank);d.className="dot "+(res==="pass"?"p":res==="fail"?"f":"u");}});
 var lm=document.getElementById("liveMeter");if(lm)lm.innerHTML=meterHTML(x.r);
 var ls=document.getElementById("liveScore");if(ls){ls.innerHTML=x.p+'<span>/12</span>';ls.className="score "+v.c;}
 var la=document.getElementById("liveAction");if(la){la.innerHTML="<b>"+bt.l+"</b> — "+action(x.p,draft.valuation);la.className=bt.c;la.style.marginTop="8px";la.style.fontSize="13px";}
 var vw=document.getElementById("valboxWrap");if(vw)vw.innerHTML=valboxHTML(draft);
}
function saveDraft(){
 if(!draft.name&&!draft.ticker){alert("Add a name or ticker first.");return;}
 var p=score(draft).p;
 draft.lastUpdated=Date.now();
 draft.history=(draft.history||[]).concat([{d:Date.now(),p:p}]);
 var i=stocks.findIndex(function(s){return s.id===draft.id;});
 if(i<0)stocks=stocks.concat([draft]);else{stocks=stocks.slice();stocks[i]=draft;}
 persist();snapshotLocalBackup();draft=null;openCalc={};render();
 autoSyncAfterSave();
}
/* Pushes straight to Drive after a save — no pull-and-compare here, unlike syncNow().
   The device you just typed on is, by definition, the freshest copy right now, so there's
   nothing to reconcile. Never blocks or alerts on failure — the local save already
   succeeded regardless, this is just best-effort so Drive doesn't lag behind for long. */
function autoSyncAfterSave(){
 if(!driveState.token){setSyncStatus("Saved locally — not synced to Drive yet, tap Sync below");return;}
 setSyncStatus("Saving to Drive…");
 pushToDrive().then(function(){
  driveState.lastSynced=Date.now();persistDriveMeta();
  setSyncStatus(driveStatusText());
 }).catch(function(err){
  console.error(err);
  setSyncStatus("Couldn't reach Drive just now — tap Sync to retry");
 });
}
function exportData(){
 var blob=new Blob([JSON.stringify(stocks,null,2)],{type:"application/json"});
 var a=document.createElement("a");a.href=URL.createObjectURL(blob);
 a.download="scorecard-backup-"+new Date().toISOString().slice(0,10)+".json";a.click();
}
function importData(el){
 var file=el.files&&el.files[0];if(!file)return;
 var reader=new FileReader();
 reader.onload=function(){
  try{
   var data=JSON.parse(reader.result);
   var list=Array.isArray(data)?data:data.stocks;
   if(!Array.isArray(list))throw new Error("bad format");
   if(!confirm("This replaces all "+stocks.length+" stocks currently on this device with the backup file. Continue?"))return;
   stocks=list;persist();draft=null;render();
   alert("Backup imported.");
  }catch(e){alert("Could not read that file — make sure it's a Scorecard backup .json.");}
 };
 reader.readAsText(file);
 el.value="";
}

/* =====================================================================
   Google Drive sync
   -----------------------------------------------------------------
   Uses Google Identity Services (loaded in <head>) + the Drive REST API
   with the `drive.file` scope — this app can only ever see/touch the
   ONE file it creates for itself, never the rest of your Drive.

   SETUP (one-time, done in Google Cloud Console — see chat for the
   full walkthrough):
     1. Create a Google Cloud project, enable the "Google Drive API".
     2. Create an OAuth Client ID (type: Web application), and add
        this app's deployed URL (your GitHub Pages URL) as an
        authorized JavaScript origin.
     3. Paste that client ID below, replacing YOUR_CLIENT_ID.
   Nothing here works until step 3 is done — the app will tell you
   that plainly instead of failing silently.
   ===================================================================== */
var DRIVE_CONFIG={
 clientId:"258487739657-dlud7osnjg28ptl3rvhjf639elp7qlni.apps.googleusercontent.com",
 scope:"https://www.googleapis.com/auth/drive.file",
 fileName:"stock-scorecard-data.json"
};
var DRIVE_META_KEY="stockScorecard:driveMeta";
function loadDriveMeta(){try{var r=localStorage.getItem(DRIVE_META_KEY);if(r)return JSON.parse(r);}catch(e){}return{fileId:null,lastSynced:null};}
function persistDriveMeta(){try{localStorage.setItem(DRIVE_META_KEY,JSON.stringify({fileId:driveState.fileId,lastSynced:driveState.lastSynced}));}catch(e){}}
function driveReady(){return DRIVE_CONFIG.clientId.indexOf("YOUR_CLIENT_ID")!==0;}
function driveStatusText(){
 if(!driveReady())return"Not set up yet — see setup notes in the code / chat";
 if(!driveState.token)return driveState.lastSynced?("Last synced "+fmtWhen(driveState.lastSynced)+" · reconnect to resume auto-sync"):"Not connected — connect once, then every save auto-syncs";
 return driveState.lastSynced?("Auto-syncing · last saved to Drive "+fmtWhen(driveState.lastSynced)):"Connected — will auto-sync after your next save";
}
function fmtWhen(t){var d=daysSince(t);if(d===0)return"today";if(d===1)return"1 day ago";return d+" days ago";}
function setSyncStatus(t){var el=document.getElementById("driveStatus");if(el)el.textContent=t;}

var tokenClient=null;
function ensureTokenClient(){
 if(tokenClient)return tokenClient;
 if(!window.google||!google.accounts||!google.accounts.oauth2)return null;
 tokenClient=google.accounts.oauth2.initTokenClient({client_id:DRIVE_CONFIG.clientId,scope:DRIVE_CONFIG.scope,callback:""});
 return tokenClient;
}
function connectDrive(){
 if(!driveReady()){alert("Google Drive isn't set up yet for this app — it needs a one-time Google Cloud OAuth client ID. See the setup notes near DRIVE_CONFIG in the code.");return;}
 var tc=ensureTokenClient();
 if(!tc){alert("Google Sign-In hasn't loaded yet — check your connection and try again in a moment.");return;}
 tc.callback=function(resp){
  if(resp.error){alert("Google sign-in failed: "+resp.error);return;}
  driveState.token=resp.access_token;
  syncNow();
 };
 tc.requestAccessToken({prompt:"consent"});
}
function driveFetch(url,opts){
 opts=opts||{};
 opts.headers=Object.assign({Authorization:"Bearer "+driveState.token},opts.headers||{});
 return fetch(url,opts).then(function(res){
  if(!res.ok)return res.text().then(function(t){throw new Error("Drive API error "+res.status+": "+t);});
  return res;
 });
}
function findDriveFile(){
 var q=encodeURIComponent("name='"+DRIVE_CONFIG.fileName+"' and trashed=false");
 return driveFetch("https://www.googleapis.com/drive/v3/files?q="+q+"&spaces=drive&fields=files(id,modifiedTime)")
  .then(function(res){return res.json();})
  .then(function(data){return(data.files&&data.files[0])||null;});
}
function pullFromDrive(){
 return findDriveFile().then(function(file){
  if(!file)return null;
  driveState.fileId=file.id;
  return driveFetch("https://www.googleapis.com/drive/v3/files/"+file.id+"?alt=media").then(function(res){return res.json();});
 });
}
function pushToDrive(){
 var body=JSON.stringify({stocks:stocks,exportedAt:new Date().toISOString()},null,2);
 var metadata={name:DRIVE_CONFIG.fileName,mimeType:"application/json"};
 var boundary="sc_boundary_"+Date.now();
 var multipart="--"+boundary+"\r\nContent-Type: application/json; charset=UTF-8\r\n\r\n"+JSON.stringify(metadata)+"\r\n"
  +"--"+boundary+"\r\nContent-Type: application/json\r\n\r\n"+body+"\r\n--"+boundary+"--";
 var url=driveState.fileId
  ?"https://www.googleapis.com/upload/drive/v3/files/"+driveState.fileId+"?uploadType=multipart"
  :"https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart";
 var method=driveState.fileId?"PATCH":"POST";
 return driveFetch(url,{method:method,headers:{"Content-Type":"multipart/related; boundary="+boundary},body:multipart})
  .then(function(res){return res.json();})
  .then(function(data){driveState.fileId=data.id;});
}
var LOCAL_BACKUP_KEY="stockScorecard:preSyncBackup";
function snapshotLocalBackup(){try{localStorage.setItem(LOCAL_BACKUP_KEY,JSON.stringify({stocks:stocks,savedAt:Date.now()}));}catch(e){}}
function loadLocalBackupMeta(){try{var r=localStorage.getItem(LOCAL_BACKUP_KEY);if(r)return JSON.parse(r);}catch(e){}return null;}
function restoreLocalBackup(){
 var b=loadLocalBackupMeta();
 if(!b){alert("No local backup snapshot found on this device yet — one gets saved automatically right before every sync.");return;}
 if(!confirm("Restore the snapshot from "+fmtWhen(b.savedAt)+"? It has "+b.stocks.length+" stock(s). This replaces what's currently loaded on this device (Drive is untouched either way)."))return;
 stocks=b.stocks;persist();draft=null;render();
 alert("Restored "+b.stocks.length+" stock(s) from the "+fmtWhen(b.savedAt)+" snapshot.");
}
function syncNow(){
 if(!driveState.token){connectDrive();return;}
 snapshotLocalBackup(); // always taken before touching anything, regardless of what happens next
 setSyncStatus("Syncing…");
 pullFromDrive().then(function(remote){
  if(!remote||!Array.isArray(remote.stocks)||!remote.stocks.length){
   return pushToDrive().then(function(){driveState.lastSynced=Date.now();persistDriveMeta();setSyncStatus("Synced just now");render();});
  }
  // Never decide this silently — always show real counts and require an explicit, clearly-labeled tap.
  syncPrompt={remote:remote.stocks,remoteWhen:remote.exportedAt,localCount:stocks.length,remoteCount:remote.stocks.length};
  render();
 }).catch(function(err){
  console.error(err);
  setSyncStatus("Sync failed — try again");
  alert("Sync failed: "+err.message);
 });
}
function syncPromptHTML(){
 var p=syncPrompt;if(!p)return"";
 return '<div class="modal-backdrop"><div class="modal">'
  +'<h3>Drive already has saved data</h3>'
  +'<p class="sub">This device currently has <b>'+p.localCount+'</b> stock(s). Drive has <b>'+p.remoteCount+'</b> stock(s)'
  +(p.remoteWhen?', last saved '+esc(new Date(p.remoteWhen).toLocaleString()):'')+'. '
  +'Whatever you pick, this device\'s current data is already backed up locally — <span class="lnk c" style="cursor:pointer" onclick="restoreLocalBackup()">restore it</span> any time from Settings if needed.</p>'
  +'<button class="btn" style="width:100%;margin-bottom:8px" onclick="resolveSyncPrompt(\'keep\')">Keep this device\'s '+p.localCount+' — push to Drive</button>'
  +'<button class="btn-o" style="width:100%;margin-bottom:8px" onclick="resolveSyncPrompt(\'load\')">Load Drive\'s '+p.remoteCount+' instead</button>'
  +'<button class="lnk" style="display:block;width:100%;text-align:center;color:var(--dim)" onclick="resolveSyncPrompt(\'cancel\')">Cancel, decide later</button>'
  +'</div></div>';
}
function resolveSyncPrompt(choice){
 var p=syncPrompt;syncPrompt=null;
 if(!p||choice==="cancel"){setSyncStatus("Sync cancelled");render();return;}
 if(choice==="load"){
  stocks=p.remote;persist();draft=null;
  driveState.lastSynced=Date.now();persistDriveMeta();
  render();
 }else{
  pushToDrive().then(function(){driveState.lastSynced=Date.now();persistDriveMeta();render();}).catch(function(err){alert("Push failed: "+err.message);render();});
 }
}

render();

if("serviceWorker"in navigator){
 window.addEventListener("load",function(){navigator.serviceWorker.register("sw.js").catch(function(err){console.warn("Service worker registration failed",err);});});
}
</script>
